<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Remindly</title>
    <meta name="description" content="Your personal reminders: smart quick-add, repeating reminders, notifications, calendar and insights. Works offline." />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Remindly" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Apply theme before first paint to avoid a flash.
      try {
        const s = JSON.parse(localStorage.getItem('remindly.v1') || '{}').settings || {};
        const theme = s.theme || 'dark';
        const dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (s.accent && s.accent !== 'mono') document.documentElement.style.setProperty('--accent', s.accent);
      } catch {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-orb">
          <svg viewBox="0 0 108 108">
            <circle class="draw" cx="54" cy="54" r="52" />
            <path class="draw" d="M38 30c20 0 26 14 15 24s-9 27 13 30" />
            <path class="draw" d="M8 64c14-4 22-2 30 4M66 84c12 2 22 0 32-8" />
          </svg>
        </div>
        <div class="splash-word">remindly</div>
      </div>
    </div>
    <div class="app" id="app">
      <header class="topbar" id="topbar">
        <div class="topbar-inner">
          <h1 class="topbar-title" id="topTitle">Today</h1>
          <div class="topbar-actions">
            <button class="icon-btn" id="searchBtn" aria-label="Search">
              <svg><use href="#i-search" /></svg>
            </button>
          </div>
        </div>
      </header>

      <main class="views" id="views">
        <section class="view" data-view="today" aria-label="Today"></section>
        <section class="view" data-view="upcoming" aria-label="Upcoming"></section>
        <section class="view" data-view="calendar" aria-label="Calendar"></section>
        <section class="view" data-view="lists" aria-label="Lists"></section>
        <section class="view" data-view="me" aria-label="Me"></section>
      </main>

      <button class="fab" id="fab" aria-label="New reminder">
        <svg><use href="#i-plus" /></svg>
      </button>

      <nav class="tabbar" id="tabbar" role="tablist">
        <div class="tab-indicator" id="tabIndicator"></div>
        <button class="tab" role="tab" data-tab="today">
          <svg><use href="#i-sun" /></svg><span>Today</span><i class="tab-badge" data-badge="today"></i>
        </button>
        <button class="tab" role="tab" data-tab="upcoming">
          <svg><use href="#i-upcoming" /></svg><span>Upcoming</span>
        </button>
        <button class="tab" role="tab" data-tab="calendar">
          <svg><use href="#i-calendar" /></svg><span>Calendar</span>
        </button>
        <button class="tab" role="tab" data-tab="lists">
          <svg><use href="#i-grid" /></svg><span>Lists</span>
        </button>
        <button class="tab" role="tab" data-tab="me">
          <svg><use href="#i-user" /></svg><span>Me</span>
        </button>
      </nav>

      <div class="scrim" id="scrim"></div>

      <!-- Pushed sub-page (list detail, search, completed) -->
      <div class="page" id="page" aria-hidden="true"></div>
    </div>

    <!-- Quick add composer -->
    <div class="backdrop" id="composerBackdrop"></div>
    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-row">
        <input id="composerInput" type="text" placeholder="Remind me to..." enterkeyhint="done" />
        <button type="submit" class="send-btn" id="composerSend" aria-label="Add">
          <svg><use href="#i-arrow-up" /></svg>
        </button>
      </div>
      <div class="composer-suggest" id="composerSuggest">
        <div><div class="starters h-scroll" id="starters"></div></div>
      </div>
      <div class="composer-chips" id="composerChips"></div>
      <div class="composer-tools">
        <button type="button" class="chip-btn" data-q="today">Today</button>
        <button type="button" class="chip-btn" data-q="tomorrow">Tomorrow</button>
        <button type="button" class="chip-btn" data-q="tonight">Tonight</button>
        <button type="button" class="chip-btn" data-q="in 1 hour">In 1h</button>
        <button type="button" class="chip-btn" data-q="next week">Next week</button>
        <button type="button" class="chip-btn" data-q="every day">Daily</button>
        <button type="button" class="chip-btn" data-q="!!">!! Priority</button>
        <button type="button" class="chip-btn accent" id="composerMore">
          <svg><use href="#i-sliders" /></svg>Details
        </button>
      </div>
    </form>

    <!-- Bottom sheet (editor, pickers) -->
    <div class="backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grabber" id="sheetGrabber"><span></span></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>

    <div class="banner" id="banner"></div>
    <div class="toasts" id="toasts"></div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </symbol>
        <symbol id="i-upcoming" viewBox="0 0 24 24">
          <path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5M16 2v4M8 2v4M3 10h5" />
          <circle cx="16" cy="16" r="6" />
          <path d="M16 14v2.2l1.4 1" />
        </symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.3-4.3" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
        <symbol id="i-check-circle" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="m8.5 12 2.5 2.5 4.5-5" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <path
            d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
          />
        </symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" /></symbol>
        <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3" /></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7" /></symbol>
        <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
        <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
        <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-alarm" viewBox="0 0 24 24">
          <circle cx="12" cy="13" r="8" />
          <path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3" />
        </symbol>
        <symbol id="i-tag" viewBox="0 0 24 24">
          <path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z" />
          <circle cx="7.5" cy="7.5" r="1.2" />
        </symbol>
        <symbol id="i-note" viewBox="0 0 24 24">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zM14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8" />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="14" height="14" rx="2" />
          <path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2" />
        </symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></symbol>
        <symbol id="i-subtasks" viewBox="0 0 24 24">
          <rect x="3" y="4" width="6" height="6" rx="1.5" />
          <path d="m4.5 7 1 1 2-2M13 7h8M13 17h8" />
          <rect x="3" y="14" width="6" height="6" rx="1.5" />
        </symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.6 1-4.7 4.6 1.1 6.5L12 17.4l-5.9 3.1 1.1-6.5L2.5 9.4l6.6-1z" /></symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24">
          <path d="M22 12h-6l-2 3h-4l-2-3H2" />
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
        </symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" /></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" /></symbol>
        <symbol id="i-sparkles" viewBox="0 0 24 24">
          <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" />
          <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" />
        </symbol>
        <symbol id="i-flame" viewBox="0 0 24 24">
          <path
            d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"
          />
        </symbol>
        <symbol id="i-more" viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1.3" />
          <circle cx="12" cy="12" r="1.3" />
          <circle cx="19" cy="12" r="1.3" />
        </symbol>
        <symbol id="i-undo" viewBox="0 0 24 24">
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
        </symbol>
        <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.7s7 7.4 7 12.3a7 7 0 0 1-14 0c0-4.9 7-12.3 7-12.3z" /></symbol>
        <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" /></symbol>
        <symbol id="i-phone" viewBox="0 0 24 24">
          <path
            d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"
          />
        </symbol>
        <symbol id="i-card" viewBox="0 0 24 24">
          <rect x="2" y="5" width="20" height="14" rx="2" />
          <path d="M2 10h20M6 15h4" />

          <path d="M2 21c0-3 1.9-5.4 5.2-6.1" />
        </symbol>
        <symbol id="i-pill" viewBox="0 0 24 24"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7zM8.5 8.5l7 7" /></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z" /></symbol>
        <symbol id="i-arrow-ne" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9" /></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.1-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24">
          <rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none" />
          <rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" /></symbol>
        <symbol id="i-volume" viewBox="0 0 24 24">
          <path d="M11 5 6 9H2v6h4l5 4V5z" />
          <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" />
        </symbol>
        <symbol id="i-volume-x" viewBox="0 0 24 24">
          <path d="M11 5 6 9H2v6h4l5 4V5z" />
          <path d="m22 9-6 6M16 9l6 6" />
        </symbol>
        <symbol id="i-target" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="5" />
          <circle cx="12" cy="12" r="1.2" fill="currentColor" />
        </symbol>
        <symbol id="i-calendar-plus" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18M12 13.5v5M9.5 16h5" />
        </symbol>
        <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 10v4M6 7v10M10 4v16M14 8v8M18 6v12M22 10v4" /></symbol>
        <symbol id="i-vibrate" viewBox="0 0 24 24">
          <rect x="8" y="4" width="8" height="16" rx="1.5" />
          <path d="m3 8 2 2-2 2 2 2-2 2M21 8l-2 2 2 2-2 2 2 2" />
        </symbol>
        <symbol id="i-sunrise" viewBox="0 0 24 24">
          <path d="M12 2v6M4.9 10.9l1.4 1.4M2 18h2M20 18h2M17.7 12.3l1.4-1.4M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0" />
        </symbol>
      </defs>
    </svg>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
